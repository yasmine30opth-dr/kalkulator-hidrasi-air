<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Hidrasi Air Harian</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 500px;">
        <div class="d-flex justify-content-end mb-3">
            <button id="btnTheme" class="btn btn-outline-secondary btn-sm fw-bold">Mode Gelap</button>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-primary mb-3">Kalkulator Hidrasi Air Harian (Water Intake Calculator)</h3>
                <p class="text-muted small">Hitung kebutuhan air harian anda.</p>

                <div class="mb-3">
                    <label for="beratBadan" class="form-label fw-bold">Berat badan anda (kg) :</label>
                    <input type="number" id="beratBadan" class="form-control" placeholder="masukkan berat badan anda">
                    <label for="durasiOlahraga" class="form-label fw-bold">Durasi olahraga anda (menit) :</label>
                    <input type="number" id="durasiOlahraga" class="form-control" placeholder="masukkan durasi olahraga anda">
                </div>

                <button id="btnHitung" class="btn btn-primary w-100 fw-bold">Hitung</button>

                <div id="areaHasil" class="alert alert-info mt-4 d-none">
                    <h5 class="fw-bold mb-2">Kebutuhan air harian anda adalah :</h5>
                    <div id="teksHasil"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
